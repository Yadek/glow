name: Repository statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-statistics
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'Yadek/glow' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collector
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify collector
        working-directory: source
        run: python -m unittest discover -s tools -p test_github_stats.py -v

      - name: Load history branch
        working-directory: source
        shell: bash
        run: |
          set +e
          git ls-remote --exit-code --heads origin refs/heads/stats > "$RUNNER_TEMP/glow-stats-ref"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --no-tags origin refs/heads/stats
            git worktree add -b stats ../data FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            git worktree add --detach ../data HEAD
            git -C ../data switch --orphan stats
          else
            exit "$status"
          fi

      - name: Collect observations and render graph
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TRAFFIC_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
        run: python source/tools/github_stats.py --repository Yadek/glow --data-dir data

      - name: Save history
        working-directory: data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- history.json overview.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: update repository statistics"
          git push origin HEAD:refs/heads/stats
