name: Build & Release

# Every push builds the full pipeline (app + installer) so breakage shows up
# straight away instead of at release time. Only tags publish a Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]            # e.g. v1.2.0 or v1.2.0-beta.1
  workflow_dispatch:

permissions:
  contents: write           # required to create a GitHub Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Tag builds take their version from the tag. Branch builds get a throwaway
      # version — they are only here to prove the pipeline still works.
      # A version with a pre-release suffix (v1.2.0-beta.1) is published as a
      # GitHub prerelease, which the /releases/latest endpoint never returns, so
      # installed stable builds are never offered a beta.
      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/v*') {
            $v = $ref -replace '^refs/tags/v', ''
          } else {
            $v = "0.0.0-dev"
          }
          $prerelease = if ($v -match '-') { 'true' } else { 'false' }
          $numeric = ($v -split '-')[0]      # VERSIONINFO can't take a suffix
          "version=$v"             | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$numeric"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v (numeric: $numeric, prerelease: $prerelease)"

      - name: Restore
        run: dotnet restore src/Glow/Glow.csproj

      - name: Publish (self-contained single-file)
        run: >
          dotnet publish src/Glow/Glow.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:PublishSingleFile=true
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer (ISCC)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & "$iscc" "installer\glow.iss" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DAppVersionNumeric=${{ steps.ver.outputs.numeric }}" `
            "/DSourceExe=$PWD\publish\Glow.exe"

      - name: Stage portable exe
        shell: pwsh
        run: Copy-Item publish/Glow.exe "installer/Output/Glow-${{ steps.ver.outputs.version }}-portable.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Glow-${{ steps.ver.outputs.version }}
          path: installer/Output/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Glow ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: installer/Output/*.exe
